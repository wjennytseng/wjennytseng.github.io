<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Jenny Tseng</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; position: relative; isolation: isolate; overflow: hidden; padding: 48px 20px; }
    .lost .lens { width: min(70vw, 300px); margin-bottom: 36px; }
    .lost h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(48px, 8vw, 88px); line-height: 1; letter-spacing: -0.02em; }
    .lost p { margin: 20px auto 32px; max-width: 42ch; color: var(--muted); font-size: 18px; }
  </style>
</head>
<body>
  <main class="lost">
    <div class="hero-bg" aria-hidden="true"><span class="glow glow-1"></span><span class="glow glow-2"></span><span class="glow glow-3"></span></div>
    <div>
      <div class="lens" aria-hidden="true">
        <svg class="lens-svg" viewBox="0 0 520 520">
          <circle class="ring-fill-outer" cx="260" cy="260" r="252"/><circle class="ring-fill-mid" cx="260" cy="260" r="200"/><circle class="ring-fill-inner" cx="260" cy="260" r="148"/>
          <circle class="ring ring-outer" cx="260" cy="260" r="252"/><circle class="ring" cx="260" cy="260" r="200"/><circle class="ring" cx="260" cy="260" r="148"/>
          <g class="orbit orbit-1"><circle cx="260" cy="112" r="6"/></g>
          <g class="orbit orbit-3"><circle cx="260" cy="512" r="7"/></g>
        </svg>
      </div>
      <p class="eyebrow"><span>404</span>Page not found</p>
      <h1>This page wandered <em>off the map.</em></h1>
      <p>It may have moved. Everything about my work, direction, and experience is on the home page.</p>
      <a class="btn btn-primary" href="/">Back to home <svg class="icon icon-arrow-right" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
    </div>
  </main>
</body>
</html>
